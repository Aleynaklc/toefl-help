services:
  - type: web
    name: toefl-vocab-backend
    env: python
    buildCommand: "pip install ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./toefl_vocab.db
      - key: ANTHROPIC_API_KEY
        sync: false
